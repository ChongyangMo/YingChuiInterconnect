syntax = "proto3";

package yingchui.v1;

// Phase 1 uses the same fields through a length-prefixed JSON bootstrap codec.
// This schema is the compatibility contract for the later generated Swift/C# codec.
message Envelope {
  uint32 protocol_version = 1;
  // 当前协议 9；视频能力与兼容下限为可选扩展，实际 JSON 字段由共享 WireMessage 定义。
  string message_id = 2;
  uint64 sent_at_milliseconds = 3;
  optional uint32 minimum_protocol_version = 4;

  oneof payload {
    Hello hello = 10;
    Ping ping = 11;
    Pong pong = 12;
    Error error = 13;
    PairRequest pair_request = 14;
    PairResult pair_result = 15;
    PointerMove pointer_move = 16;
    MouseButton mouse_button = 17;
    Scroll scroll = 18;
    TextInput text_input = 19;
    StreamStart stream_start = 20;
    StreamStop stream_stop = 21;
    VideoConfig video_config = 22;
    KeyframeRequest keyframe_request = 23;
    StreamStats stream_stats = 24;
    Heartbeat heartbeat = 25;
    KeyPress key_press = 26;
    ControlAck control_ack = 27;
    ClipboardGet clipboard_get = 28;
    ClipboardSet clipboard_set = 29;
    ClipboardResult clipboard_result = 30;
  }
}

message Hello {
  string device_name = 1;
  string device_id = 2;
  string session_token = 3;
  bool accepted = 4;
  string host_id = 5;
}

message Ping {}
message Pong {}

message Error {
  string detail = 1;
  string error_message = 2;
}

message PairRequest {
  string device_id = 1;
  string device_name = 2;
  string pairing_code = 3;
}

message PairResult {
  bool accepted = 1;
  string detail = 2;
  string session_token = 3;
}

message PointerMove {
  double delta_x = 1;
  double delta_y = 2;
}

message MouseButton {
  enum Button {
    BUTTON_UNSPECIFIED = 0;
    LEFT = 1;
    RIGHT = 2;
  }
  Button button = 1;
  bool pressed = 2;
}

message Scroll {
  double delta_x = 1;
  double delta_y = 2;
}

message TextInput {
  string text = 1;
}

message KeyPress {
  enum Key {
    KEY_UNSPECIFIED = 0;
    ESCAPE = 1;
    RETURN = 2;
    TAB = 3;
    SPACE = 4;
    DELETE_BACKWARD = 5;
    DELETE_FORWARD = 6;
    ARROW_UP = 7;
    ARROW_DOWN = 8;
    ARROW_LEFT = 9;
    ARROW_RIGHT = 10;
    HOME = 11;
    END = 12;
    PAGE_UP = 13;
    PAGE_DOWN = 14;
    LETTER_A = 15;
    LETTER_C = 16;
    LETTER_V = 17;
    LETTER_W = 18;
    LETTER_X = 19;
    LETTER_Z = 20;
  }

  enum Modifier {
    MODIFIER_UNSPECIFIED = 0;
    COMMAND = 1;
    OPTION = 2;
    CONTROL = 3;
    SHIFT = 4;
  }

  Key key = 1;
  repeated Modifier modifiers = 2;
}

message ControlAck {}

message StreamStart {
  uint32 video_port = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 frame_rate = 4;
  uint32 bit_rate = 5;
  uint32 viewport_width = 6;
  uint32 viewport_height = 7;
  uint32 audio_port = 8;
  optional bool audio_enabled = 9;
  repeated VideoDecodeCapability video_capabilities = 10;
}

message VideoDecodeCapability {
  string codec = 1;
  uint32 maximum_width = 2;
  uint32 maximum_height = 3;
  uint32 maximum_frame_rate = 4;
  optional uint64 maximum_pixels_per_second = 5;
}

message StreamStop {}

message VideoConfig {
  string stream_id = 1;
  string codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 frame_rate = 5;
  uint32 bit_rate = 6;
  repeated bytes parameter_sets = 7;
  bytes video_key = 8;
}

message KeyframeRequest {
  string stream_id = 1;
}

message StreamStats {
  string stream_id = 1;
  uint64 packets_received = 2;
  uint64 frames_decoded = 3;
  uint64 frames_dropped = 4;
}

message Heartbeat {}

// UDP video datagrams are independently encrypted and authenticated with
// ChaCha20-Poly1305. The TLS-only video_key is rotated for every stream. The
// plaintext is the compact VideoDatagramCodec header and negotiated H.264/HEVC fragment.

message ClipboardGet {}
message ClipboardSet { string text = 1; }
message ClipboardResult {
  bool accepted = 1;
  string text = 2;
  string error_message = 3;
}

// 声音使用独立 UDP 端口，同一流密钥、每包独立随机认证 nonce。
// 明文为 AudioPacketCodec：版本魔数、流 UUID、序号、帧数、48 kHz 双声道 s16le PCM。
// 每包最多 240 帧，不承载麦克风。
